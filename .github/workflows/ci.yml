name: ci

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
      - "codex/**"
      - "claude/**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: "1"
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  PR_BODY: ${{ github.event.pull_request.body || '' }}

jobs:
  policy:
    name: policy
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guard Delphi reference sources
        shell: pwsh
        run: ./ci/scripts/check_no_delphi_changes.ps1

      - name: Guard legacy resource files
        shell: pwsh
        run: ./ci/scripts/check_resource_format.ps1

      - name: Guard unsafe compatibility changes
        shell: pwsh
        run: ./ci/scripts/check_unsafe_policy.ps1

      - name: Guard large compatibility changes
        shell: pwsh
        run: ./ci/scripts/check_change_scope.ps1

      - name: Check text hygiene
        shell: pwsh
        run: ./ci/scripts/check_text_hygiene.ps1

  windows-fast:
    name: windows-fast
    runs-on: windows-latest
    needs: policy

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install C++ dependencies
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) {
            $vcpkgRoot = "C:\vcpkg"
          }
          & "$vcpkgRoot\vcpkg.exe" install sqlite3:x64-windows

      - name: Build ModernServer and ModernClient
        shell: pwsh
        run: ./ci/scripts/check_build.ps1 -Project all -Config Debug -Suite phase2-fast

      - name: Run CTest smoke tests
        shell: pwsh
        run: ./ci/scripts/run_compat_tests.ps1 -Suite phase2-fast -Config Debug
